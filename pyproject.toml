[project]
name = "haymaker-azure-workloads"
version = "0.1.0"
description = "Azure infrastructure workloads for Agent Haymaker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Haymaker Team" }
]
keywords = ["azure", "haymaker", "workload", "telemetry", "infrastructure"]

[project.urls]
Homepage = "https://github.com/rysweet/haymaker-azure-workloads"
Repository = "https://github.com/rysweet/haymaker-azure-workloads"
Issues = "https://github.com/rysweet/haymaker-azure-workloads/issues"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "agent-haymaker>=0.1.0",
    "azure-cli-core>=2.50.0",
    "azure-identity>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
ai = [
    "agent-haymaker[llm]>=0.1.0",
]

# Register workload with agent-haymaker
[project.entry-points."agent_haymaker.workloads"]
azure-infrastructure = "haymaker_azure_workloads:AzureInfrastructureWorkload"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haymaker_azure_workloads"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
